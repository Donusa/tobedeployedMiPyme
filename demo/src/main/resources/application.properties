spring.application.name=mipyme
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.multiTenancy=DATABASE
spring.jpa.properties.hibernate.multi_tenant=DATABASE
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:86400}
mipyme.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
mipyme.tenant.default-schema=mipyme

# TiendaNube Configuration
tiendanube.app-id=${TIENDANUBE_APP_ID}
tiendanube.client-secret=${TIENDANUBE_CLIENT_SECRET}
tiendanube.webhook-base-url=${TIENDANUBE_WEBHOOK_BASE_URL}

# MercadoLibre Configuration
mercadolibre.app-id=${MERCADOLIBRE_APP_ID}
mercadolibre.client-secret=${MERCADOLIBRE_CLIENT_SECRET}
mercadolibre.redirect-uri=${MERCADOLIBRE_REDIRECT_URI}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*

# WhatsApp Configuration
whatsapp.verify-token=${WPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.meta-app-id=${META_APP_ID}
whatsapp.meta-app-secret=${META_APP_SECRET}
whatsapp.meta-config-id=${META_CONFIG_ID}
whatsapp.graph-version=${META_GRAPH_VERSION}
whatsapp.connect-session-ttl-min=${CONNECT_SESSION_TTL_MIN:10}
# Set to true ONLY in dev to bypass HMAC-SHA256 signature check and diagnose webhook delivery
whatsapp.skip-signature-validation=${WPP_SKIP_SIG:false}

# MercadoPago Configuration
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET}
# Plan IDs are now stored in the mp_plan_config table. Provision them via POST /api/mercadopago/admin/provision-plans
mercadopago.back-url=${MP_BACK_URL}
# USD prices for each plan (used to calculate ARS equivalent)
mercadopago.price-usd.base=9
mercadopago.price-usd.pro=19
mercadopago.price-usd.enterprise=29
# Annual = 10 months cost (discount of 2 months)
mercadopago.price-usd.base-annual=90
mercadopago.price-usd.pro-annual=190
mercadopago.price-usd.enterprise-annual=290
# Threshold in ARS to trigger plan price update
mercadopago.exchange-rate.threshold=100