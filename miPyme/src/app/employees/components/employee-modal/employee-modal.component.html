<div class="employee-modal-overlay" (click)="cancel()">
  <div class="employee-modal-content" (click)="$event.stopPropagation()">
    <div class="form-container">
      <h3>{{ employee ? 'Editar Empleado' : 'Nuevo Empleado' }}</h3>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="name" [disabled]="isLoading" placeholder="Nombre completo">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" [disabled]="isLoading" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label>Contraseña {{ employee ? '(Opcional)' : '' }}</label>
        <input type="password" [(ngModel)]="password" [disabled]="isLoading"
               placeholder="{{ employee ? 'Dejar vacío para no cambiar' : 'Mínimo 6 caracteres' }}">
      </div>

      <div class="form-group">
        <label>Permisos</label>
        <div class="permissions-grid">
          <label class="checkbox-label" *ngFor="let perm of availablePermissions">
            <input type="checkbox"
                   [checked]="isPermissionSelected(perm)"
                   (change)="togglePermission(perm)"
                   [disabled]="isLoading">
            <span class="text-capitalize">{{ perm }}</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Sucursales</label>
        <div class="permissions-grid" *ngIf="warehouses.length > 0">
          <label class="checkbox-label" *ngFor="let w of warehouses">
            <input type="checkbox"
                   [checked]="isWarehouseSelected(w.warehouseId!)"
                   (change)="toggleWarehouse(w.warehouseId!)"
                   [disabled]="isLoading">
            <span>{{ w.warehouseName }}</span>
          </label>
        </div>
        <p class="empty-hint" *ngIf="warehouses.length === 0">No hay sucursales creadas.</p>
      </div>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="isLoading">Cancelar</button>
        <button type="button" class="btn-primary" (click)="save()" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner"></span>
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
