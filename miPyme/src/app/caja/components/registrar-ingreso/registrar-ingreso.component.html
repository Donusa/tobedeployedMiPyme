<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="bx bx-plus-circle"></i> Registrar Ingreso</h3>
      <button class="close-btn" (click)="cerrar.emit()"><i class="bx bx-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group flex-1">
          <label>Tipo</label>
          <select [(ngModel)]="tipo">
            <option *ngFor="let t of tiposIngreso" [value]="t.value">{{ t.label }}</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label>Medio de pago</label>
          <select [(ngModel)]="medioPago">
            <option *ngFor="let m of mediosPago" [value]="m.value">{{ m.label }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Monto *</label>
        <div class="input-with-prefix">
          <span class="prefix">$</span>
          <input type="number" [(ngModel)]="monto" min="0.01" step="0.01" placeholder="0.00" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label>Descripción *</label>
        <input type="text" [(ngModel)]="descripcion" placeholder="Motivo del ingreso">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="isSubmitting">
        <i class="bx" [ngClass]="isSubmitting ? 'bx-loader-alt bx-spin' : 'bx-check'"></i>
        {{ isSubmitting ? 'Registrando...' : 'Registrar Ingreso' }}
      </button>
    </div>
  </div>
</div>
