<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="bx bx-play-circle"></i> Abrir Caja</h3>
      <button class="close-btn" (click)="cerrar.emit()"><i class="bx bx-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="info-banner">
        <i class="bx bx-store-alt"></i>
        Sucursal: <strong>{{ sucursalNombre }}</strong>
      </div>

      <div class="form-group">
        <label>Monto de apertura (efectivo) *</label>
        <div class="input-with-prefix">
          <span class="prefix">$</span>
          <input type="number" [(ngModel)]="montoApertura" min="0" step="0.01" placeholder="0.00" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label>Observación (opcional)</label>
        <textarea [(ngModel)]="observacion" rows="2" placeholder="Nota de apertura..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="isSubmitting">
        <i class="bx" [ngClass]="isSubmitting ? 'bx-loader-alt bx-spin' : 'bx-check'"></i>
        {{ isSubmitting ? 'Abriendo...' : 'Abrir Caja' }}
      </button>
    </div>
  </div>
</div>
