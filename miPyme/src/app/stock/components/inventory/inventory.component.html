<div class="abm-container">

  <div class="header-actions">
    <div class="search-create-group">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterItems()" placeholder="Buscar por nombre o código..."
        class="search-input">
    </div>
  </div>

  <div class="list-container">
    <app-spinner *ngIf="isLoading"></app-spinner>


    @if (!layoutService.isMobile() && !isLoading) {
    <table class="data-table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Producto / Variante</th>
          <th style="width: 150px;">Stock Actual</th>
          <th style="width: 100px;">Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredItems; trackBy: trackByFn" [class.variant-row]="item.level > 0"
          [class.group-row]="item.type === 'PRODUCT_GROUP'">
          <td>
            <span [style.padding-left.px]="item.level * 20" class="item-code">{{ item.code }}</span>
          </td>
          <td>
            <span [style.padding-left.px]="item.level * 20" class="item-name"
              [style.font-weight]="item.level === 0 ? '600' : '400'">
              {{ item.name }}
            </span>
          </td>
          <td>
            <div class="stock-display-wrapper">
              <span class="stock-badge" [class.stock-ok]="(item.minStock === 0 || item.stock > item.minStock * 1.5)"
                [class.stock-warning]="item.minStock > 0 && item.stock > item.minStock && item.stock <= item.minStock * 1.5"
                [class.stock-danger]="item.minStock > 0 && item.stock <= item.minStock">
                {{ item.stock }}
              </span>
            </div>
          </td>
          <td>
            <span class="status-badge" [ngClass]="getStockStatus(item).cssClass">
              {{ getStockStatus(item).label }}
            </span>
          </td>
        </tr>
        <tr *ngIf="filteredItems.length === 0">
          <td colspan="4" class="empty-state">No se encontraron productos</td>
        </tr>
      </tbody>
    </table>
    }


    @if (layoutService.isMobile() && !isLoading) {
    <app-mobile-card-list
      [items]="filteredItems"
      [columns]="mobileColumns"
      [actions]="[]"
      emptyMessage="No se encontraron productos.">
    </app-mobile-card-list>
    }

  </div>
</div>
