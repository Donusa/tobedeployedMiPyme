<div class="corporate-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1 class="corp-title">Cambiar Contraseña</h1>
      <p class="corp-subtitle">Gestión de la credencial de acceso a su cuenta institucional.</p>
    </div>
  </div>

  <div class="main-content">
    <app-spinner *ngIf="isLoading"></app-spinner>

    <div *ngIf="successMessage" class="alert alert-success mt-4">
      <i class="fas fa-check-circle"></i> {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-4">
      <i class="fas fa-exclamation-triangle"></i> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #passwordForm="ngForm" *ngIf="!isLoading" autocomplete="off">
      <section class="edit-form-panel">

        <div class="detail-group">
          <label for="currentPassword" class="detail-label">CONTRASEÑA ACTUAL</label>
          <div class="input-icon-wrapper">
            <input [type]="showCurrent ? 'text' : 'password'" id="currentPassword" name="currentPassword"
              class="edit-form-control" [(ngModel)]="currentPassword" (input)="onInputChange()" required
              autocomplete="off" placeholder="Ingrese su contraseña actual">
            <i class="bx" [class.bx-show]="!showCurrent" [class.bx-hide]="showCurrent"
              (click)="toggleVisibility('current')"></i>
          </div>
        </div>

        <div class="detail-group">
          <label for="newPassword" class="detail-label">NUEVA CONTRASEÑA</label>
          <div class="input-icon-wrapper">
            <input [type]="showNew ? 'text' : 'password'" id="newPassword" name="newPassword" class="edit-form-control"
              [(ngModel)]="newPassword" (input)="onInputChange()" required minlength="6" autocomplete="new-password"
              placeholder="Ingrese una nueva contraseña segura">
            <i class="bx" [class.bx-show]="!showNew" [class.bx-hide]="showNew" (click)="toggleVisibility('new')"></i>
          </div>
        </div>

        <div class="detail-group">
          <label for="confirmPassword" class="detail-label">CONFIRMAR NUEVA CONTRASEÑA</label>
          <div class="input-icon-wrapper">
            <input [type]="showConfirm ? 'text' : 'password'" id="confirmPassword" name="confirmPassword"
              class="edit-form-control" [(ngModel)]="confirmPassword" (input)="onInputChange()" required
              autocomplete="new-password" placeholder="Repita la nueva contraseña">
            <i class="bx" [class.bx-show]="!showConfirm" [class.bx-hide]="showConfirm"
              (click)="toggleVisibility('confirm')"></i>
          </div>
          <div *ngIf="confirmPassword && newPassword" style="margin-top: 0.5rem;">
            <small *ngIf="confirmPassword === newPassword" class="text-success"
              style="font-size: 0.85rem; font-weight: 500;">
              <i class="fas fa-check"></i> Las contraseñas coinciden
            </small>
            <small *ngIf="confirmPassword !== newPassword" class="text-danger"
              style="font-size: 0.85rem; font-weight: 500;">
              <i class="fas fa-times"></i> Las contraseñas no coinciden
            </small>
          </div>
        </div>

        <div class="form-actions" style="text-align: right; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
          <button type="submit" class="edit-btn-primary"
            [disabled]="!passwordForm.form.valid || newPassword !== confirmPassword">Cambiar Contraseña</button>
        </div>

      </section>
    </form>
  </div>
</div>
